# v1.1 | 06-Sep-2026 | Include deterministic WP2.1 audio normalisation tests.
# v1.0 | 05-Sep-2026 | Run deterministic WP1 checks without model or hardware services.

name: WP1 Tier A #v1.0
on: #v1.0
  pull_request: #v1.0
  push: #v1.0
permissions: #v1.0
  contents: read #v1.0
jobs: #v1.0
  wp1: #v1.0
    runs-on: ubuntu-latest #v1.0
    timeout-minutes: 15 #v1.0
    env: #v1.0
      NEXT_TELEMETRY_DISABLED: '1' #v1.0
      HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }} #v1.0
    steps: #v1.0
      - uses: actions/checkout@v4 #v1.0
        with: #v1.0
          fetch-depth: 0 #v1.0
      - uses: actions/setup-python@v5 #v1.0
        with: #v1.0
          python-version: '3.11' #v1.0
      - uses: actions/setup-node@v4 #v1.0
        with: #v1.0
          node-version: '22' #v1.0
          cache: npm #v1.0
          cache-dependency-path: apps/web/package-lock.json #v1.0
      - name: Install backend with test and development tooling #v1.0
        run: python -m pip install -e 'backend[test,dev]' #v1.0
      - name: Python lint and whitespace formatting #v1.0
        run: python -m ruff check --config backend/pyproject.toml backend scripts #v1.0
      - name: Backend contracts and unchanged turn schema #v1.0
        run: python -m unittest discover -s backend/tests/contract -v #v1.0
      - name: Audio normalisation tests #v1.1
        run: python -m unittest discover -s backend/tests/unit -v #v1.1
      - name: Repository checker tests #v1.0
        run: python -m unittest discover -s scripts/tests -v #v1.0
      - name: Version histories and tracked runtime paths #v1.0
        run: python scripts/check_code_history.py #v1.0
      - name: Install simulator dependencies #v1.0
        working-directory: apps/web #v1.0
        run: npm ci #v1.0
      - name: Simulator tests #v1.0
        working-directory: apps/web #v1.0
        run: npm test #v1.0
      - name: Simulator lint #v1.0
        working-directory: apps/web #v1.0
        run: npm run lint #v1.0
      - name: Simulator production build #v1.0
        working-directory: apps/web #v1.0
        run: npm run build #v1.0
      - name: Real localhost HTTP integration #v1.0
        run: python scripts/check_wp1_integration.py --start-services #v1.0
