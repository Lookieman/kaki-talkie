# v1.0 | 07-Sep-2026 | Package the local Whisper HTTP adapter separately from orchestration.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaki-whisper-cpp"
version = "0.1.0"
description = "Local whisper.cpp STT adapter for KaKi-Talkie"
requires-python = ">=3.11"
dependencies = ["kaki-backend==0.1.0", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kaki_whisper_cpp*"]
