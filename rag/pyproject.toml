# v1.0 | 10-Sep-2026 | Package the corpus ingestion pipeline; stdlib plus httpx only.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaki-rag"
version = "0.1.0"
description = "KaKi-Talkie grounded-knowledge corpus ingestion and retrieval"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kaki_rag*"]
